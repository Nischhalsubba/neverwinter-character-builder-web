name: Validate and deploy Neverwinter character builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neverwinter-character-builder-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify calculator formulas
        run: npm test
      - name: Build static character builder
        run: npm run build
      - name: Verify static publishing artifacts
        run: test -f index.html && test -f dist/index.html && test -f dist/robots.txt && test -d dist/assets
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
